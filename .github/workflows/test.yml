name: Test images

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.ubuntu_version }}, ${{ matrix.ubuntu_name }}, ${{ matrix.arch }})
    # Each architecture builds and tests natively (amd64 on ubuntu-24.04,
    # arm64 on ubuntu-24.04-arm) — DinD cannot run under QEMU emulation
    # (netfilter/runc kernel interfaces are not translated by qemu-user).
    #
    # TEMPORARY pin to 24.04: Sysbox only supports a specific set of distros/kernels
    # (https://github.com/nestybox/sysbox/blob/master/docs/distro-compat.md). The
    # kernel 7.0 on newer runner images (ubuntu-latest / ubuntu-26.04) appears to be
    # unstable with Sysbox (observed in CI, not an official Sysbox statement).
    # Revert to ubuntu-latest only once kernel 7.x is officially supported by Sysbox.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ["22.04", "24.04", "26.04"]
        arch: [amd64, arm64]
        include:
          - ubuntu_version: "22.04"
            ubuntu_name: "jammy"
          - ubuntu_version: "24.04"
            ubuntu_name: "noble"
          - ubuntu_version: "26.04"
            ubuntu_name: "resolute"
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install sysbox
        run: |
          cd /tmp
          # v0.7.1 is only published as GitHub release assets, not on
          # downloads.nestybox.com (which stops at v0.7.0).
          wget https://github.com/nestybox/sysbox/releases/download/v0.7.1/sysbox-ce_0.7.1.linux_${{ matrix.arch }}.deb
          sudo dpkg -i sysbox-ce_0.7.1.linux_${{ matrix.arch }}.deb || sudo apt-get install -f -y
          # The .deb postinstall cannot always start the service via systemctl
          # during dpkg (deb-systemd-invoke), so start it explicitly and wait
          # for the sysbox-fs socket before running sysbox-runc tests. The socket
          # lives in a root-only directory, so the checks must run with sudo.
          sudo systemctl restart sysbox || {
            sudo journalctl -u sysbox -u sysbox-fs -u sysbox-mgr --no-pager | tail -50
            exit 1
          }
          for i in $(seq 1 30); do
            sudo test -S /run/sysbox/sysfs.sock && break
            sleep 1
          done
          sudo systemctl status sysbox-fs sysbox-mgr --no-pager || true
          sudo test -S /run/sysbox/sysfs.sock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build standalone image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          tags: |
            cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-test

      - name: Test standalone image (privileged mode)
        run: |
          chmod +x test.sh
          ./test.sh --mode privileged --use-systemd false --image-name cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-test

      - name: Test standalone image (sysbox-runc mode)
        run: |
          ./test.sh --mode sysbox-runc --use-systemd false --image-name cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-test

      - name: Build systemd image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          file: Dockerfile.systemd
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          tags: |
            cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-systemd-test

      - name: Test systemd image (privileged mode)
        run: |
          ./test.sh --mode privileged --use-systemd true --image-name cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-systemd-test

      - name: Test systemd image (sysbox-runc mode)
        run: |
          ./test.sh --mode sysbox-runc --use-systemd true --image-name cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-systemd-test
