name: Build and push Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CURRENT_VERSION: 29.8.1
  BUILD_NUMBER: 0
  LATEST_UBUNTU_VERSION: "26.04"
  DOCKERHUB_IMAGE: cruizba/ubuntu-dind
  GHCR_IMAGE: ghcr.io/cruizba/ubuntu-dind
  QUAY_IMAGE: quay.io/cruizba/ubuntu-dind

jobs:
  # Each architecture is built and tested natively (amd64 on ubuntu-24.04,
  # arm64 on ubuntu-24.04-arm) and pushed by digest. No QEMU emulation is
  # involved: emulated arm64 builds were hitting intermittent segfaults in
  # glibc under qemu-user (see run 30701419100). The merge job below stitches
  # the per-arch digests into the final multi-arch manifests.
  build:
    name: build (${{ matrix.ubuntu_version }}, ${{ matrix.ubuntu_name }}, ${{ matrix.arch }})
    # TEMPORARY pin to 24.04: Sysbox only supports a specific set of distros/kernels
    # (https://github.com/nestybox/sysbox/blob/master/docs/distro-compat.md). The
    # kernel 7.0 on newer runner images (ubuntu-latest / ubuntu-26.04) appears to be
    # unstable with Sysbox (observed in CI, not an official Sysbox statement).
    # Revert to ubuntu-latest only once kernel 7.x is officially supported by Sysbox.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        ubuntu_version: ["22.04", "24.04", "26.04"]
        arch: [amd64, arm64]
        include:
          - ubuntu_version: "22.04"
            ubuntu_name: jammy
          - ubuntu_version: "24.04"
            ubuntu_name: noble
          - ubuntu_version: "26.04"
            ubuntu_name: resolute
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install sysbox
        run: |
          cd /tmp
          # v0.7.1 is only published as GitHub release assets, not on
          # downloads.nestybox.com (which stops at v0.7.0).
          wget https://github.com/nestybox/sysbox/releases/download/v0.7.1/sysbox-ce_0.7.1.linux_${{ matrix.arch }}.deb
          sudo dpkg -i sysbox-ce_0.7.1.linux_${{ matrix.arch }}.deb || sudo apt-get install -f -y
          # The .deb postinstall cannot always start the service via systemctl
          # during dpkg (deb-systemd-invoke), so start it explicitly and wait
          # for the sysbox-fs socket before running sysbox-runc tests. The socket
          # lives in a root-only directory, so the checks must run with sudo.
          sudo systemctl restart sysbox || {
            sudo journalctl -u sysbox -u sysbox-fs -u sysbox-mgr --no-pager | tail -50
            exit 1
          }
          for i in $(seq 1 30); do
            sudo test -S /run/sysbox/sysfs.sock && break
            sleep 1
          done
          sudo systemctl status sysbox-fs sysbox-mgr --no-pager || true
          sudo test -S /run/sysbox/sysfs.sock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: cruizba
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build standalone image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          tags: |
            cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-test

      - name: Test standalone image (privileged mode)
        run: |
          chmod +x test.sh
          ./test.sh --mode privileged --use-systemd false --image-name cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-test

      - name: Test standalone image (sysbox-runc mode)
        run: |
          ./test.sh --mode sysbox-runc --use-systemd false --image-name cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-test

      - name: Push standalone image by digest
        id: push-standalone
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }},${{ env.QUAY_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Build systemd image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          file: Dockerfile.systemd
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          tags: |
            cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-systemd-test

      - name: Test systemd image (privileged mode)
        run: |
          ./test.sh --mode privileged --use-systemd true --image-name cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-systemd-test

      - name: Test systemd image (sysbox-runc mode)
        run: |
          ./test.sh --mode sysbox-runc --use-systemd true --image-name cruizba/ubuntu-dind:${{ matrix.ubuntu_name }}-systemd-test

      - name: Push systemd image by digest
        id: push-systemd
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Dockerfile.systemd
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }},${{ env.QUAY_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        env:
          STANDALONE_DIGEST: ${{ steps.push-standalone.outputs.digest }}
          SYSTEMD_DIGEST: ${{ steps.push-systemd.outputs.digest }}
        run: |
          mkdir -p /tmp/digests/standalone /tmp/digests/systemd
          touch "/tmp/digests/standalone/${STANDALONE_DIGEST#sha256:}"
          touch "/tmp/digests/systemd/${SYSTEMD_DIGEST#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.ubuntu_name }}-${{ matrix.arch }}
          path: /tmp/digests/
          if-no-files-found: error
          retention-days: 1

  # Combines the per-arch digests pushed by the build jobs into multi-arch
  # manifest lists and applies the final tags on every registry. Runs only if
  # all architectures built and passed their tests.
  merge:
    name: merge (${{ matrix.ubuntu_version }}, ${{ matrix.ubuntu_name }})
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - ubuntu_version: "22.04"
            ubuntu_name: jammy
          - ubuntu_version: "24.04"
            ubuntu_name: noble
          - ubuntu_version: "26.04"
            ubuntu_name: resolute
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.ubuntu_name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: cruizba
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Create and push standalone manifests
        working-directory: /tmp/digests/standalone
        run: |
          for repo in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE" "$QUAY_IMAGE"; do
            tags=(-t "$repo:${{ matrix.ubuntu_name }}-${CURRENT_VERSION}"
                  -t "$repo:${{ matrix.ubuntu_name }}-${CURRENT_VERSION}-r${BUILD_NUMBER}"
                  -t "$repo:${{ matrix.ubuntu_name }}-latest")
            if [ "${{ matrix.ubuntu_version }}" = "$LATEST_UBUNTU_VERSION" ]; then
              tags+=(-t "$repo:latest")
            fi
            docker buildx imagetools create "${tags[@]}" $(printf "$repo@sha256:%s " *)
          done

      - name: Create and push systemd manifests
        working-directory: /tmp/digests/systemd
        run: |
          for repo in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE" "$QUAY_IMAGE"; do
            tags=(-t "$repo:${{ matrix.ubuntu_name }}-systemd-${CURRENT_VERSION}"
                  -t "$repo:${{ matrix.ubuntu_name }}-systemd-${CURRENT_VERSION}-r${BUILD_NUMBER}"
                  -t "$repo:${{ matrix.ubuntu_name }}-systemd-latest")
            if [ "${{ matrix.ubuntu_version }}" = "$LATEST_UBUNTU_VERSION" ]; then
              tags+=(-t "$repo:systemd-latest")
            fi
            docker buildx imagetools create "${tags[@]}" $(printf "$repo@sha256:%s " *)
          done

      - name: Inspect manifests
        run: |
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:${{ matrix.ubuntu_name }}-${CURRENT_VERSION}"
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:${{ matrix.ubuntu_name }}-systemd-${CURRENT_VERSION}"
